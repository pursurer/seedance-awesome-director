name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s skills/seedance-production-workflow/scripts -p 'test_*.py'
      - run: python skills/seedance-production-workflow/scripts/validate_plan.py examples/bookstore-envelope/plan.json
